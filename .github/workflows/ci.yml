name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build the app for Apple silicon and Intel
        run: |
          ./scripts/build-app.sh --universal
          codesign --verify --strict "build/Get Caffeinated.app"
          lipo -archs "build/Get Caffeinated.app/Contents/MacOS/GetCaffeinated"
